{{ define "main" }}
<div class="max-w-4xl mx-auto px-4">
  <div class="mb-8 text-center">
    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-gray-100 mb-3" style="margin-top: 1rem;">
      <i class="fas fa-project-diagram text-violet-600 dark:text-violet-400 mr-2" aria-hidden="true"></i>{{ .Title }}
    </h1>
    <div class="text-gray-600 dark:text-gray-400 text-lg max-w-2xl mx-auto">{{ .Content }}</div>
  </div>

  <div class="mb-12">
    {{ partial "projects" . }}
  </div>
</div>
{{ end }}
