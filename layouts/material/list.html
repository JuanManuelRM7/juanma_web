{{ define "main" }}
<header class="page-head wrap">
  {{ partial "breadcrumb.html" . }}
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="page-head__lead">{{ . }}</div>{{ end }}
</header>
<div class="wrap" style="margin-top: var(--space-2xl)">
  <div class="notes">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}">
      <h2>{{ .Title }}</h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
