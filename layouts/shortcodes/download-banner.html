{{ $title := .Get "title" }}
{{ $description := .Get "description" }}
{{ $buttonText := .Get "buttonText" }}
{{ $downloadUrl := .Get "downloadUrl" }}

<div class="download ticks">
  <div>
    <h3>{{ $title }}</h3>
    {{ with $description }}<p>{{ . }}</p>{{ end }}
  </div>
  <a class="btn btn--sm" href="{{ $downloadUrl }}" download>{{ $buttonText }}</a>
</div>
