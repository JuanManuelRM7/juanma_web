{{/* Herramientas por categoría, como en el CV. Datos: params.skill.categories (key, name, items[]). */}}
<div class="skills">
  {{ range $cat := .Site.Params.skill.categories }}
  <div>
    <h3 data-i18n="skill_cat_{{ $cat.key }}">{{ $cat.name }}</h3>
    <ul>{{ range $j, $s := $cat.items }}<li data-i18n="skill_{{ $cat.key }}_{{ add $j 1 }}">{{ $s }}</li>{{ end }}</ul>
  </div>
  {{ end }}
</div>
