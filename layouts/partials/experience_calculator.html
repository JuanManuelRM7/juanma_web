<div id="experience-stats">
  <p class="text-lg font-bold text-violet-600 dark:text-violet-400">
    <span id="total-experience">...</span>
  </p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var display = document.getElementById('total-experience');
  if (!display) return;

  // start/end come from config.yaml (params.experience.list[].start/end, "YYYY-MM"; empty end = present)
  var experiences = [
    {{- range .Site.Params.experience.list }}
    { start: {{ .start | default "" }}, end: {{ .end | default "" }} },
    {{- end }}
  ];

  function parseYM(s) {
    var m = /^(\d{4})-(\d{2})$/.exec(s || '');
    return m ? new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, 1) : null;
  }

  var now = new Date();
  var earliest = now, latest = now;
  experiences.forEach(function(exp) {
    var s = parseYM(exp.start);
    var e = exp.end ? parseYM(exp.end) : now;
    if (s && s < earliest) earliest = s;
    if (e && e > latest) latest = e;
  });

  var totalMonths = (latest.getFullYear() - earliest.getFullYear()) * 12 + (latest.getMonth() - earliest.getMonth());
  totalMonths = Math.max(1, totalMonths);

  function updateDisplay() {
    var lang = (window.localStorage && window.localStorage.getItem('lang')) || document.documentElement.getAttribute('lang') || 'es';
    var years = Math.floor(totalMonths / 12);
    var months = totalMonths % 12;
    var yWord, mWord, andWord;
    if (lang === 'en') {
      yWord = years === 1 ? 'year' : 'years';
      mWord = months === 1 ? 'month' : 'months';
      andWord = 'and';
    } else {
      yWord = years === 1 ? 'año' : 'años';
      mWord = months === 1 ? 'mes' : 'meses';
      andWord = 'y';
    }
    if (years === 0) display.textContent = months + ' ' + mWord;
    else {
      display.textContent = years + ' ' + yWord;
      if (months > 0) {
        // Segunda línea más pequeña: en la sidebar no cabe todo en una
        var rest = document.createElement('span');
        rest.className = 'block text-xs font-medium';
        rest.textContent = andWord + ' ' + months + ' ' + mWord;
        display.appendChild(rest);
      }
    }
  }

  updateDisplay();
  window.updateExperienceDisplay = updateDisplay;
});
</script>
