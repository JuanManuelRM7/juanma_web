{{/* Anterior / siguiente dentro de la misma sección */}}
{{ if or .PrevInSection .NextInSection }}
<nav class="prevnext" aria-label="{{ i18n "content_related" }}">
  {{ with .NextInSection }}<a class="prev" href="{{ .RelPermalink }}"><span>←</span>{{ .Title }}</a>{{ else }}<span></span>{{ end }}
  {{ with .PrevInSection }}<a class="next" href="{{ .RelPermalink }}"><span>→</span>{{ .Title }}</a>{{ end }}
</nav>
{{ end }}
