  // Make translations globally available
  window.__i18n = translations;

  function applyLang(lang) {
    var strings = translations[lang];
    if (!strings) return;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      var isHtml = el.hasAttribute('data-i18n-html');
      // Cache original Hugo-rendered content on first interaction
      if (!el.hasAttribute('data-i18n-orig')) {
        el.setAttribute('data-i18n-orig', isHtml ? el.innerHTML : el.textContent);
      }
      if (strings[key] !== undefined) {
        if (isHtml) {
          el.innerHTML = strings[key];
        } else {
          el.textContent = strings[key];
        }
      } else {
        // Restore original Hugo-rendered content
        var orig = el.getAttribute('data-i18n-orig');
        if (orig !== null) {
          if (isHtml) { el.innerHTML = orig; } else { el.textContent = orig; }
        }
      }
    });
    // Also translate aria-labels
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-aria');
      if (strings[key]) el.setAttribute('aria-label', strings[key]);
    });
    var label = document.getElementById('lang-label');
    if (label) label.textContent = lang === 'es' ? 'EN' : 'ES';
    window.localStorage.setItem('lang', lang);
    document.documentElement.setAttribute('lang', lang);

    // Update clock if present
    if (typeof window.updateClock === 'function') window.updateClock();
    // Update experience calculator if present
    if (typeof window.updateExperienceDisplay === 'function') window.updateExperienceDisplay();
    // Update Giscus language if present
    var gf = document.querySelector('iframe.giscus-frame');
    if (gf) {
      gf.contentWindow.postMessage(
        { giscus: { setConfig: { lang: lang } } },
        'https://giscus.app'
      );
    }
  }

  window.applyLang = applyLang;

  // Language the page was statically rendered in (Hugo multilingual)
  var pageLang = document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'es';

  window.toggleLang = function() {
    var current = window.localStorage.getItem('lang') || pageLang;
    applyLang(current === 'es' ? 'en' : 'es');
  };

  window.getI18n = function(key) {
    var lang = window.localStorage.getItem('lang') || 'es';
    return (translations[lang] && translations[lang][key]) || key;
  };

  // Apply saved language on load (only if it differs from the page's own language)
  var saved = window.localStorage.getItem('lang');
  if (saved && saved !== pageLang) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() { applyLang(saved); });
    } else {
      applyLang(saved);
    }
  }
