<!-- Translations generated from config.yaml: params (es) and languages.en.params (en).
     Keys here are data-driven so hero, profile, projects and experience never need manual duplication.
     Only the homepage swaps these strings in place; every other page with profile content has a
     Hugo translation and the toggle navigates to it, so the block is not emitted there. -->
{{ if .IsHome }}
<script>
window.__i18nDyn = {
  {{- range .Site.Home.AllTranslations }}
  {{ .Language.Lang }}: {
    profile_position: {{ .Site.Params.profile.position }},
    profile_location: {{ .Site.Params.profile.location }},
    aboutme_title: {{ .Site.Params.aboutme.title }},
    aboutme_description: {{ .Site.Params.aboutme.description }},
    hero_value: {{ .Site.Params.hero.value }},
    {{- range $i, $m := .Site.Params.hero.metrics }}
    {{ printf "hero_metric_%d_value" (add $i 1) }}: {{ $m.value }},
    {{ printf "hero_metric_%d_label" (add $i 1) }}: {{ $m.label }},
    {{- end }}
    {{- range $p := .Site.Params.project.list }}
    {{ printf "proj_title_%s" $p.id }}: {{ $p.title }},
    {{ printf "proj_desc_%s" $p.id }}: {{ $p.description }},
    {{- range $i, $m := $p.metrics }}
    {{ printf "proj_metric_%s_%d" $p.id (add $i 1) }}: {{ $m }},
    {{- end }}
    {{- with $p.links }}{{ range $i, $l := .posts }}
    {{ printf "proj_post_%s_%d" $p.id (add $i 1) }}: {{ $l.title }},
    {{- end }}{{ end }}
    {{- end }}
    {{- range $i, $e := .Site.Params.experience.list }}
    {{ printf "exp_position_%d" (add $i 1) }}: {{ $e.position }},
    {{ printf "exp_company_%d" (add $i 1) }}: {{ $e.company }},
    {{- range $j, $t := $e.tags }}
    {{ printf "exp_tag_%d_%d" (add $i 1) (add $j 1) }}: {{ $t }},
    {{- end }}
    {{ printf "exp_dates_%d" (add $i 1) }}: {{ $e.dates | markdownify }},
    {{ printf "exp_details_%d" (add $i 1) }}: {{ $e.details | markdownify }},
    {{- $hl := "" }}{{ range $e.highlights }}{{ $hl = printf "%s<li>%s</li>" $hl (. | markdownify) }}{{ end }}
    {{ printf "exp_hl_%d" (add $i 1) }}: {{ $hl }},
    {{- end }}
    {{- range $i, $e := .Site.Params.education.list }}
    {{ printf "edu_degree_%d" (add $i 1) }}: {{ $e.degree }},
    {{ printf "edu_details_%d" (add $i 1) }}: {{ $e.details | default "" }},
    {{ printf "edu_thesis_%d" (add $i 1) }}: {{ $e.thesis_title | default "" }},
    {{- end }}
    {{- range $p := .Site.Params.publication.list }}
    {{ printf "pub_status_%s" $p.id }}: {{ $p.status_label | default $p.status }},
    {{ printf "pub_venue_%s" $p.id }}: {{ $p.venue | default "" }},
    {{ printf "pub_org_%s" $p.id }}: {{ $p.org | default "" }},
    {{- end }}
    {{- range $c := .Site.Params.skill.categories }}
    {{ printf "skill_cat_%s" $c.key }}: {{ $c.name }},
    {{- range $j, $s := $c.items }}
    {{ printf "skill_%s_%d" $c.key (add $j 1) }}: {{ $s }},
    {{- end }}
    {{- end }}
    {{- range $i, $c := .Site.Params.certifications.list }}
    {{ printf "cert_title_%d" (add $i 1) }}: {{ $c.title }},
    {{ printf "cert_issuer_%d" (add $i 1) }}: {{ $c.issuer | default "" }},
    {{- end }}
  },
  {{- end }}
};
</script>
{{ end }}
<!-- Global i18n translation system -->
<script>
(function() {
  // UI strings, generated from i18n/es.yaml and i18n/en.yaml (the single source of truth)
  var translations = {
    {{- range $lang := slice "es" "en" }}
    {{ $lang }}: {
      {{- range $key, $entry := os.ReadFile (printf "i18n/%s.yaml" $lang) | transform.Unmarshal }}
      {{ $key }}: {{ $entry.other }},
      {{- end }}
    },
    {{- end }}
  };

  // Make translations globally available
  // Merge translations generated from config.yaml (see block above)
  if (window.__i18nDyn) {
    Object.keys(window.__i18nDyn).forEach(function (l) {
      translations[l] = Object.assign(translations[l] || {}, window.__i18nDyn[l]);
    });
  }
  window.__i18n = translations;

  function applyLang(lang) {
    var strings = translations[lang];
    if (!strings) return;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      var isHtml = el.hasAttribute('data-i18n-html');
      // Cache original Hugo-rendered content on first interaction
      if (!el.hasAttribute('data-i18n-orig')) {
        el.setAttribute('data-i18n-orig', isHtml ? el.innerHTML : el.textContent);
      }
      if (strings[key] !== undefined) {
        if (isHtml) {
          el.innerHTML = strings[key];
        } else {
          el.textContent = strings[key];
        }
      } else {
        // Restore original Hugo-rendered content
        var orig = el.getAttribute('data-i18n-orig');
        if (orig !== null) {
          if (isHtml) { el.innerHTML = orig; } else { el.textContent = orig; }
        }
      }
    });
    // Also translate aria-labels
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-aria');
      if (strings[key]) el.setAttribute('aria-label', strings[key]);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-placeholder');
      if (strings[key]) el.setAttribute('placeholder', strings[key]);
    });
    // Dates rendered by Hugo: reformatted with Intl; back on the page's own language the original text returns
    document.querySelectorAll('time[data-i18n-date]').forEach(function(el) {
      if (!el.hasAttribute('data-i18n-orig')) el.setAttribute('data-i18n-orig', el.textContent);
      var d = new Date(el.getAttribute('datetime') + 'T12:00:00');
      el.textContent = (lang === pageLang || isNaN(d))
        ? el.getAttribute('data-i18n-orig')
        : d.toLocaleDateString(lang, { year: 'numeric', month: 'short', day: 'numeric' });
    });
    var label = document.getElementById('lang-label');
    if (label) label.textContent = lang === 'es' ? 'EN' : 'ES';
    window.localStorage.setItem('lang', lang);
    document.documentElement.setAttribute('lang', lang);

    // Update experience calculator if present
    if (typeof window.updateExperienceDisplay === 'function') window.updateExperienceDisplay();
    // Update Giscus language if present
    var gf = document.querySelector('iframe.giscus-frame');
    if (gf) {
      gf.contentWindow.postMessage(
        { giscus: { setConfig: { lang: lang } } },
        'https://giscus.app'
      );
    }
  }

  window.applyLang = applyLang;

  // Language the page was statically rendered in (Hugo multilingual)
  var pageLang = document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'es';

  // Pages that have a Hugo translation (case studies) navigate to it; the rest swap strings in place.
  function altUrl(lang) {
    var link = document.querySelector('link[rel="alternate"][hreflang="' + lang + '"]');
    return link ? link.getAttribute('href') : null;
  }
  var isHome = document.body && document.body.getAttribute('data-kind') === 'home';

  window.toggleLang = function() {
    var current = window.localStorage.getItem('lang') || pageLang;
    var next = current === 'es' ? 'en' : 'es';
    var alt = !isHome && altUrl(next);
    if (alt) {
      window.localStorage.setItem('lang', next);
      window.location.href = alt;
      return;
    }
    applyLang(next);
  };

  // Apply saved language on load (only if it differs from the page's own language)
  var saved = window.localStorage.getItem('lang');
  if (saved && saved !== pageLang) {
    var savedAlt = !isHome && altUrl(saved);
    if (savedAlt) {
      window.location.replace(savedAlt);
    } else if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() { applyLang(saved); });
    } else {
      applyLang(saved);
    }
  }
})();
</script>
