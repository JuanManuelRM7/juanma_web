<!-- Cifras medidas bajo el hero. Valores de params.hero.metrics (ES) y languages.en.params.hero.metrics (EN);
     el toggle ES/EN los sustituye vía data-i18n. -->
{{ with .Site.Params.hero.metrics }}
<ul class="figures" aria-label="{{ i18n "aria_hero_metrics" }}" data-i18n-aria="aria_hero_metrics">
  {{ range $i, $m := . }}
  <li class="figure">
    <span class="figure__v" data-i18n="hero_metric_{{ add $i 1 }}_value">{{ $m.value }}</span>
    <span class="figure__l" data-i18n="hero_metric_{{ add $i 1 }}_label">{{ $m.label }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
