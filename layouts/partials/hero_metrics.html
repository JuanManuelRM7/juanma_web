<!-- Proof strip under the hero copy. Values come from params.hero.metrics (ES) and
     languages.en.params.hero.metrics (EN); the runtime toggle swaps them via data-i18n. -->
{{ with .Site.Params.hero.metrics }}
<ul class="hero-metrics" aria-label="Resultados destacados">
  {{ range $i, $m := . }}
  <li class="hero-metric">
    <span class="hero-metric-value" data-i18n="hero_metric_{{ add $i 1 }}_value">{{ $m.value }}</span>
    <span class="hero-metric-label" data-i18n="hero_metric_{{ add $i 1 }}_label">{{ $m.label }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
