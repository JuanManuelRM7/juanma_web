<!-- Interactive terminal easter egg. Open via ⌘K palette ("Terminal") or window.openTerminal() -->
<div id="term-overlay" class="term-overlay" hidden>
  <div class="term-window" role="dialog" aria-modal="true" aria-label="{{ i18n "term_label" }}" data-i18n-aria="term_label">
    <div class="term-titlebar">
      <span class="term-dot" style="background:#ef4444" onclick="window.closeTerminal()"></span>
      <span class="term-dot" style="background:#f59e0b"></span>
      <span class="term-dot" style="background:#22c55e"></span>
      <span class="term-title">juanma@web — zsh</span>
    </div>
    <div id="term-body" class="term-body" tabindex="-1">
      <div id="term-output"></div>
      <div class="term-input-line">
        <span class="term-prompt">juanma@web:~$</span>
        <input id="term-input" type="text" autocomplete="off" spellcheck="false" aria-label="{{ i18n "term_input" }}" data-i18n-aria="term_input" />
      </div>
    </div>
  </div>
</div>

<style>
.term-overlay {
  position: fixed;
  inset: 0;
  z-index: 130;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.term-window {
  width: 100%;
  max-width: 640px;
  border-radius: 0.75rem;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
  border: 1px solid rgb(51 65 85);
  animation: cmdkIn 0.15s ease-out;
}
.term-titlebar {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.6rem 0.9rem;
  background: #1e293b;
  border-bottom: 1px solid rgb(51 65 85);
}
.term-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; cursor: pointer; }
.term-title {
  margin-left: auto;
  margin-right: auto;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: rgb(148 163 184);
}
.term-body {
  background: #0f172a;
  color: #e2e8f0;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  line-height: 1.55;
  padding: 0.9rem;
  height: 50vh;
  max-height: 420px;
  overflow-y: auto;
  cursor: text;
}
.term-body a { color: #22d3ee; }
.term-output-cmd { color: #94a3b8; }
.term-accent { color: #22d3ee; }
.term-warn { color: #fbbf24; }
.term-input-line { display: flex; gap: 0.5rem; align-items: center; }
.term-prompt { color: #4ade80; white-space: nowrap; }
#term-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #e2e8f0;
  font-family: inherit;
  font-size: inherit;
  caret-color: #22d3ee;
}
</style>

<script>
window.__terminalData = {
  base: '{{ "" | relURL }}' || '/',
  // Contenido del perfil en los dos idiomas: el terminal sigue al toggle ES/EN
  byLang: {
    {{- range .Site.Home.AllTranslations }}
    {{ .Language.Lang }}: {
      headline: {{ .Site.Params.profile.position }},
      whoami: {{ .Site.Params.aboutme.description }},
      projectsUrl: {{ with .Site.GetPage "/proyectos" }}{{ .RelPermalink }}{{ else }}""{{ end }},
      projects: [
        {{- range .Site.Params.project.list }}
        { title: {{ .title }}, tech: {{ delimit (first 3 .tech) " · " }} },
        {{- end }}
      ],
      skills: [
        {{- range .Site.Params.skill.categories }}
        { name: {{ .name }}, items: {{ delimit .items " · " }} },
        {{- end }}
      ],
    },
    {{- end }}
  },
  social: [
    {{- range .Site.Params.social.list }}
    { title: {{ .title }}, url: {{ .url }}, label: {{ .label | default .url }} },
    {{- end }}
  ]
};
</script>
<script defer src="{{ `/js/terminal.js` | relURL }}"></script>
