<div class="wrap notfound">
  <div class="notfound__fig ticks"><span class="figure__v num">404</span></div>
  <h1 data-i18n="error_title">{{ i18n "error_title" }}</h1>
  <p data-i18n="error_message">{{ i18n "error_message" }}</p>
  <div class="links">
    <a class="btn" href="{{ .Site.Home.RelPermalink }}"><span data-i18n="action_home">{{ i18n "action_home" }}</span></a>
    <a class="btn btn--line" href="{{ `blog/` | relURL }}"><span data-i18n="action_view_blog">{{ i18n "action_view_blog" }}</span></a>
    <a class="btn btn--line" href="{{ `search/` | relURL }}"><span data-i18n="nav_search">{{ i18n "nav_search" }}</span></a>
  </div>
  <p class="quote" data-i18n="error_quote">{{ i18n "error_quote" }}</p>
</div>
