<!-- Revelado suave de secciones al entrar en pantalla. Solo se ocultan las que aún están por debajo
     de la vista al cargar, así la primera pantalla (y una captura) siempre sale completa. -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els = [].slice.call(document.querySelectorAll('[data-reveal]')).filter(function (el) { return el.getBoundingClientRect().top > innerHeight; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.style.opacity = ''; e.target.classList.add('animate-fade-in-up'); io.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -60px 0px' });
  els.forEach(function (el) { el.style.opacity = '0'; io.observe(el); });
});
</script>
