<head>
  {{ partial "meta" . }}
  <!-- Favicon JM -->
  <link rel="icon" type="image/svg+xml" href="{{ `favicon.svg` | relURL }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Font Awesome 6 self-hosted (v5 class names siguen funcionando) -->
  <link rel="preload" href="{{ `/fontawesome/webfonts/fa-solid-900.woff2` | relURL }}" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ `/fontawesome/webfonts/fa-brands-400.woff2` | relURL }}" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{{ `/fontawesome/css/all.min.css` | relURL }}" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Didact+Gothic%7CRoboto:400%7CRoboto+Mono&display=swap"
  />

  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Params.title }} – RSS" href="{{ `index.xml` | absURL }}" />
  {{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Params.title }}" href="{{ .RelPermalink }}" />
  {{ end }}

  {{ $css := resources.Get "main.css" | postCSS }}
  {{ if hugo.IsProduction }}
  {{ $css = $css | minify | fingerprint | resources.PostProcess }}
  {{ end }}
  <link href="{{ $css.RelPermalink }}" rel="stylesheet" />
  <link rel="stylesheet" href="{{ `/css/main.css` | relURL }}" />
  <link rel="stylesheet" href="{{ `/css/search.css` | relURL }}" />
  <link rel="stylesheet" href="{{ `/css/general.css` | relURL }}" />
  <link rel="stylesheet" href="{{ `/css/syntax.css` | relURL }}" />

  <script>
    let html = document.querySelector("html");
    let theme = window.localStorage.getItem("theme");

    const setTheme = (theme) => {
      html.classList.remove("light");
      if (theme === "dark") {
        html.classList.add("dark");
        window.localStorage.setItem("theme", "dark");
      } else {
        html.classList.remove("dark");
        window.localStorage.setItem("theme", "light");
      }
      fixThemeToggleIcon(theme);
    };

    const fixThemeToggleIcon = (theme) => {
      let themeToggle = document.querySelector(".theme-toggle");
      if (themeToggle) {
        if (theme === "dark") {
          themeToggle.classList.remove("fa-moon");
          themeToggle.classList.add("fa-sun");
        } else {
          themeToggle.classList.remove("fa-sun");
          themeToggle.classList.add("fa-moon");
        }
      }
    };

    if (theme == null) {
      if (html.classList.contains("dark")) {
        theme = "dark";
      } else if (html.classList.contains("light")) {
        theme = "light";
      } else {
        // console.log("will use device theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (prefersDark) {
          theme = "dark";
        } else {
          theme = "light";
        }
      }
    }

    setTheme(theme);

    const toggleTheme = () => {
      html.classList.contains("dark") ? setTheme("light") : setTheme("dark");
    };

    window.onload = () => {
      fixThemeToggleIcon(theme);

      let defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };

    window.onresize = () => {
      let defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };
  </script>
  <!-- Plausible Analytics -->
  <script defer data-domain="juanmanuel.petrer.eu" src="https://plausible.io/js/script.js"></script>
</head>
