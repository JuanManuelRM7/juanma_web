{{ if not .IsHome }}
<nav class="crumbs" aria-label="{{ i18n "aria_breadcrumb" }}" data-i18n-aria="aria_breadcrumb">
  <a href="{{ .Site.Home.RelPermalink }}" data-i18n="nav_home">{{ i18n "nav_home" }}</a>
  {{ if .IsPage }}{{ with .Parent }}{{ if not .IsHome }}<span aria-hidden="true">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}{{ end }}
</nav>
{{ end }}
