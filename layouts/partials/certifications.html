{{/* Certificaciones: params.certifications.list (title, issuer). Van al final de la columna de educación. */}}
{{ range $i, $c := .Site.Params.certifications.list }}
<div class="entry">
  <p class="entry__when" data-i18n="section_certs">{{ i18n "section_certs" }}</p>
  <h3><span data-i18n="cert_title_{{ add $i 1 }}">{{ $c.title }}</span>{{ with $c.issuer }} · <span data-i18n="cert_issuer_{{ add $i 1 }}">{{ . }}</span>{{ end }}</h3>
</div>
{{ end }}
