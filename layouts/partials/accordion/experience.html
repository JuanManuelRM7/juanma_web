{{ range $idx, $el := .Site.Params.experience.list }}
<div class="timeline-item">
  <div class="timeline-dot"></div>
  <div class="card border-l-4 border-l-violet-600 dark:border-l-violet-400 bg-white dark:bg-slate-800 p-5 mb-4 rounded-lg shadow-sm hover:shadow-md">
    <div class="flex items-start justify-between mb-2 gap-3">
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-1">
          <i class="fas fa-briefcase text-violet-600 dark:text-violet-400"></i>
          <h4 class="text-lg font-semibold text-gray-900 dark:text-gray-100 m-0"><span data-i18n="exp_position_{{ add $idx 1 }}">{{ .position }}</span></h4>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-400 m-0 flex items-center gap-1">
          {{ if .url }}
          <a href="{{ .url }}" class="hover:text-violet-600 dark:hover:text-violet-400">{{ .company }}</a>
          {{ else }} {{ .company }} {{ end }}
        </p>
      </div>
      <span class="text-sm text-violet-600 dark:text-violet-400 font-medium flex-shrink-0" data-i18n="exp_dates_{{ add $idx 1 }}" data-i18n-html>{{ .dates | markdownify }}</span>
    </div>
    
    {{ if .details }}
    <div class="prose prose-stone dark:prose-invert max-w-none text-sm text-gray-700 dark:text-gray-300 mb-3" data-i18n="exp_details_{{ add $idx 1 }}" data-i18n-html>
    {{ .details | markdownify }}
    </div>
    {{ end }}
    
    <!-- Quick skills tags -->
    {{ with .tags }}
    <div class="flex flex-wrap gap-2 pt-3 border-t border-gray-200 dark:border-gray-700">
      {{ range . }}
      <span class="px-2 py-1 rounded text-xs font-medium bg-violet-100 dark:bg-violet-900/30 text-violet-700 dark:text-violet-300">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
