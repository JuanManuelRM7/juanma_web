<!-- Barra inferior en móvil: aparece al bajar con el nombre, el CV, LinkedIn y el email -->
<div class="mobile-bar" data-sticky-header>
  <div class="mobile-bar__in">
    <div class="mobile-bar__who">
      <p>{{ .Site.Params.profile.short_name | default .Site.Params.profile.name }}</p>
      <p data-i18n="profile_position">{{ .Site.Params.profile.position }}</p>
    </div>
    <div class="links">
      <a class="btn btn--sm" href="{{ partial "cv_url" . }}" data-cv-es="{{ `/cv.pdf` | relURL }}" data-cv-en="{{ `/cv-en.pdf` | relURL }}">CV</a>
      {{ range .Site.Params.social.list }}{{ if eq .icon "fab fa-linkedin-in" }}<a class="btn btn--line btn--sm btn--icon" href="{{ .url }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>{{ end }}{{ end }}
      {{ range .Site.Params.social.list }}{{ if eq .icon "fas fa-envelope" }}<a class="btn btn--line btn--sm btn--icon" href="{{ .url }}" aria-label="{{ i18n "aria_email" }}" data-i18n-aria="aria_email"><i class="fas fa-envelope" aria-hidden="true"></i></a>{{ end }}{{ end }}
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var bar = document.querySelector('[data-sticky-header]'); if (!bar) return;
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { bar.classList.toggle('is-on', window.scrollY > 300); ticking = false; });
  }, { passive: true });
});
</script>
