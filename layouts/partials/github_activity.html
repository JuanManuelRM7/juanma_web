<!-- Calendario de contribuciones de GitHub, pintado en el cliente.
     La sección entera queda oculta si la llamada a la API falla. -->
<div id="gh-activity" class="ticks gh" style="margin-top: var(--space-2xl)" hidden>
  <h3 class="col-title" style="font-size: var(--text-md); margin-bottom: 16px" data-i18n="section_github">{{ i18n "section_github" }}</h3>
  <div id="gh-grid" class="gh-grid-wrap" role="img" aria-label="{{ i18n "aria_gh_calendar" }}" data-i18n-aria="aria_gh_calendar"></div>
  <div class="gh__foot">
    <span><strong id="gh-total" class="num"></strong> <span data-i18n="gh_contributions">{{ i18n "gh_contributions" }}</span></span>
    <a href="https://github.com/juanmanuelruizm" target="_blank" rel="noopener noreferrer"><span data-i18n="gh_view_profile">{{ i18n "gh_view_profile" }}</span></a>
  </div>
</div>

<script>
(function () {
  fetch('https://github-contributions-api.jogruber.de/v4/juanmanuelruizm?y=last')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var grid = document.createElement('div');
      grid.className = 'gh-grid';
      data.contributions.forEach(function (day) {
        var cell = document.createElement('div');
        cell.className = 'gh-cell';
        cell.dataset.level = day.level;
        cell.title = day.date + ': ' + day.count;
        grid.appendChild(cell);
      });
      document.getElementById('gh-grid').appendChild(grid);
      document.getElementById('gh-total').textContent = data.total.lastYear;
      document.getElementById('gh-activity').hidden = false;
      // Scroll to the most recent weeks on narrow screens
      var wrap = document.querySelector('.gh-grid-wrap');
      wrap.scrollLeft = wrap.scrollWidth;
    })
    .catch(function () { /* leave section hidden */ });
})();
</script>
