{{- /* Cabecera fija: marca, navegación, paleta ⌘K, búsqueda e idioma. Solo modo oscuro: ya no hay botón de tema. */ -}}
{{- $section := .Section -}}
<header class="site-head" role="banner">
  <div class="wrap">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Params.profile.name }}, {{ i18n "nav_home" }}">
      <svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="11" cy="11" r="5.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/><circle cx="16.2" cy="6.4" r="1.6" fill="var(--color-accent)"/></svg>
      {{ .Site.Params.profile.name }}
    </a>
    <nav class="nav" aria-label="{{ i18n "aria_main_nav" }}" data-i18n-aria="aria_main_nav">
      <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}><span data-i18n="nav_home">{{ i18n "nav_home" }}</span></a>
      <a href="{{ `proyectos/` | relLangURL }}"{{ if eq $section "proyectos" }} aria-current="page"{{ end }}><span data-i18n="nav_projects">{{ i18n "nav_projects" }}</span></a>
      <a href="{{ `blog/` | relURL }}"{{ if eq $section "blog" }} aria-current="page"{{ end }}><span data-i18n="nav_blog">{{ i18n "nav_blog" }}</span></a>
      <a href="{{ `material/` | relURL }}"{{ if eq $section "material" }} aria-current="page"{{ end }}><span data-i18n="nav_material">{{ i18n "nav_material" }}</span></a>
    </nav>
    <div class="head-tools">
      <button type="button" class="btn btn--line btn--sm btn--cmdk" onclick="window.openCmdk && window.openCmdk()" aria-label="{{ i18n "aria_open_palette" }}" data-i18n-aria="aria_open_palette">
        <i class="fas fa-search" aria-hidden="true"></i><span class="label-wide" data-i18n="nav_search">{{ i18n "nav_search" }}</span> <kbd class="kbd">⌘K</kbd>
      </button>
      <button type="button" id="lang-toggle" class="btn btn--line btn--sm" onclick="toggleLang()" aria-label="{{ i18n "aria_toggle_lang" }}" data-i18n-aria="aria_toggle_lang">
        <span id="lang-label">{{ if eq .Site.Language.Lang "en" }}ES{{ else }}EN{{ end }}</span>
      </button>
    </div>
  </div>
</header>
