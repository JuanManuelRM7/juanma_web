<script>
document.addEventListener('DOMContentLoaded', function () {
  var label = function (k, d) { var t = (window.__i18n || {})[document.documentElement.lang] || {}; return t[k] || d; };
  document.querySelectorAll('.article pre').forEach(function (pre) {
    var box = pre.closest('.highlight') || pre;
    var button = document.createElement('button');
    button.className = 'copy-code-btn';
    button.setAttribute('aria-label', {{ i18n "action_copy_code" }});
    button.setAttribute('data-i18n-aria', 'action_copy_code');
    button.textContent = label('action_copy', 'Copiar');
    button.addEventListener('click', function () {
      var code = pre.querySelector('code');
      if (!code) return;
      navigator.clipboard.writeText(code.innerText).then(function () {
        button.textContent = label('action_copied', 'Copiado');
        setTimeout(function () { button.textContent = label('action_copy', 'Copiar'); }, 2000);
      }).catch(function () {
        var ta = document.createElement('textarea');
        ta.value = code.innerText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        button.textContent = label('action_copied', 'Copiado');
        setTimeout(function () { button.textContent = label('action_copy', 'Copiar'); }, 2000);
      });
    });
    box.appendChild(button);
  });
});
</script>
