welcome_title:
  other: "¡Bienvenido a mi sitio web!"
welcome_intro_1:
  other: "Me llamo <strong class=\"text-cyan-700 dark:text-cyan-300\">Juan Manuel</strong> y en esta página web podrás conocer más acerca de mí."
welcome_intro_2:
  other: "Creé este sitio con varios objetivos en mente: por un lado, quería aprender a montar y gestionar una web desde cero; por otro, me atraía la idea de documentar y compartir las cosas que voy aprendiendo en mi día a día. Puedes encontrar estos posts en la pestaña de <strong class=\"text-cyan-700 dark:text-cyan-300\">blog</strong> (aunque aún estoy empezando con el contenido)."
welcome_intro_3:
  other: "Todo esto también me llevó a diseñar tarjetas de presentación personalizadas —puede que incluso hayas llegado aquí gracias a una de ellas—. Así evito tener que deletrear la URL cada vez que alguien me pregunta... eso, y que un día vi un <em>short</em> de <em>American Psycho</em> y se me quedó grabado. 😄"
