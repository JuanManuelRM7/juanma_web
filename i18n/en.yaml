exp_details_1:
  other: "<ul><li>Development of extraction, transformation, and loading (ETL) pipelines for databases, dataset creation, and image preprocessing.</li><li>Training, fine-tuning, and validation of computer vision models focused on tire defect detection.</li><li>Design and implementation of custom machine learning algorithms for various computer vision projects.</li><li>Definition, analysis, and monitoring of performance metrics for model selection in production.</li><li>Writing and reviewing technical documentation.</li><li>Continuous research and updates on artificial intelligence advances.</li><li>Cross-functional collaboration to achieve project objectives.</li></ul><p>Skills: PyTorch | TensorFlow | Computer Vision | Deep Learning | CNN | Transformers | Object Detection | OpenCV | MLflow | Docker | AWS</p>"
exp_details_2:
  other: "<ul><li>Analyze and define project requirements, designing and developing machine learning solutions using state-of-the-art algorithms.</li><li>Design and implement custom machine learning algorithms for various projects, including natural language processing, neural networks, and computer vision, among others.</li><li>Stay up to date with the latest research advances in various fields of artificial intelligence.</li><li>Write and review technical documentation.</li><li>Meet with clients to understand their requirements and tailor solutions to their needs.</li><li>Collaborate with other team members to achieve project objectives.</li></ul>"
exp_details_3:
  other: "<ul><li>Development and research of Lagrangian techniques for automatic identification of atmospheric blocking situations.</li><li>Collaboration on other group projects related to atmospheric physics.</li></ul>"
