welcome_intro_1:
  other: "My name is <strong class=\"text-violet-700 dark:text-violet-300\">Juan Manuel</strong> and on this website you can learn more about me."
welcome_intro_2:
  other: "I created this site with several goals in mind: on one hand, I wanted to learn how to build and manage a website from scratch; on the other, I was drawn to the idea of documenting and sharing the things I learn on a daily basis. You can find these posts in the <strong class=\"text-violet-700 dark:text-violet-300\">blog</strong> tab (although I'm still just getting started with content)."
welcome_intro_3:
  other: "All of this also led me to design personalized business cards — you may have even arrived here thanks to one of them. This way I avoid having to spell out the URL every time someone asks... that, and one day I saw an <em>American Psycho</em> short and it stuck with me. 😄"
