  # fondo (good verde, warn amarillo, bad rojo, neutral oscuro) e `icon`, el dibujo de
  # arriba (up, down, heart, flag). El de «En el plan» es el resumen de cada km.
  scenarios:
    - name: "En el plan"
      pace: "6:31"
      hr: "152"
      zone: "Z3"
      delta: "0:12 por delante del plan"
      good: true
      banner: { kind: "summary", tone: "good", title: "KM 12", corner: "1:19:02", value: "6:31", unit: "/km", note: "−0:12", chips: [{ icon: "heart", v: "152" }, { icon: "flag", v: "2:18:48" }] }
    - name: "Por detrás"
      pace: "6:52"
      hr: "156"
      zone: "Z3"
      delta: "0:40 por detrás del plan"
      good: false
      banner: { kind: "alert", tone: "warn", icon: "up", headline: "SUBE", value: "6:52", unit: "/km", footnote: "objetivo 6:36" }
    - name: "Pulso alto"
      pace: "6:52"
      hr: "168"
      zone: "Z4"
      delta: "En el plan ajustado"
      good: true
      banner: { kind: "alert", tone: "neutral", icon: "flag", headline: "NUEVO PLAN", value: "2:23:10", unit: "", footnote: "nuevo ritmo 6:47/km" }
    - name: "Sobre el tope"
      pace: "6:40"
      hr: "176"
      zone: "Z5"
      delta: "Pulso por encima del tope"
      good: false
      banner: { kind: "alert", tone: "bad", icon: "heart", headline: "AFLOJA", value: "176", unit: "ppm", footnote: "tope 172" }
