            status: development
            status_label: "In progress"
            links:
              repo: "https://github.com/juanmanuelruizm/TFG"
              post: "/blog/tfg/"
              pdf: "/tfg.pdf"
      project:
        title: Projects
        icon: fas fa-project-diagram
        list:
          - id: vcalib
            home: true
            cover: "images/proyectos/vcalib/money_shot_level2.jpg"
            featured: true
            title: "vcalib: calibration filters for RF-DETR under illumination shift"
            description: "A ~2 KB differentiable filter that undoes an illumination shift before the image reaches a frozen detector. No retraining, no labels, minutes on a CPU."
            metrics:
              - "35.9% activation recovery on real held-out image pairs"
              - "Closes the AP gap on level_2 (SAM3 pseudo-GT)"
              - "~3.5 min to fit on a laptop CPU"
            tech: [PyTorch, RF-DETR, SAM3, uv]
            icon: "fas fa-network-wired"
            color: "cyan"
            status: active
            links:
              repo: "https://github.com/juanmanuelruizm/vcalib"
              case_study: "/en/proyectos/vcalib/"
          - id: desinformacion-ontologias
            home: true
            cover: "images/proyectos/desinformacion/pipeline.png"
            featured: true
            title: "Misinformation detection in fiction with LLM-generated ontologies"
            description: "An LLM + RAG architecture that builds a verified ontology incrementally and uses it to flag false claims in films, podcasts and texts. Published at DCAI'25."
            metrics:
              - "Precision 0.98 · F1 0.86 on 320 evaluation sentences"
              - "246-class ontology generated without supervision"
            tech: [LLMs, RAG, SBERT, GPT-4o, Python]
            icon: "fas fa-shield-alt"
            color: "violet"
            status: published
            links:
