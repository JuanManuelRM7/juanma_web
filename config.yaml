baseURL: https://juanmanuel.petrer.eu/
languageCode: es
publishDir: docs
defaultContentLanguage: es
defaultContentLanguageInSubdir: false
outputs:
  home: [HTML, RSS, JSON]
languages:
  es:
    languageName: Español
    languageCode: es
    weight: 1
  en:
    languageName: English
    languageCode: en
    weight: 2
    params:
      title: Juan Manuel Ruiz – ML Engineer & Computer Vision Specialist
      description: "ML Engineer with a physics and mathematics background, specialized in Computer Vision and Deep Learning. Portfolio, projects, publications and blog of Juan Manuel Ruiz Muñoz."
      profile:
        name: "Juan Manuel"
        location: "Elche, Alicante, Spain"
        photo: profile.png
        position: "ML Engineer · Computer Vision | Physicist & Mathematician"
      aboutme:
        title: About me
        icon: fas fa-user
        description: "Physicist and mathematician specialized in Machine Learning and Computer Vision engineering. I build computer vision systems that work in real production: from data capture and preprocessing to model deployment. I am drawn to the intersection between mathematical rigor and AI solutions with tangible impact. When I am not training models, I write about physics, chaos and meteorology on this blog."
      experience:
        title: Experience
        icon: fas fa-briefcase
        panelId: experience-panel
        list:
          - position: ML Engineer · Computer Vision & LLMs
            dates: June 2025 - *Present*
            company: VRAIA Corp.
            url: "https://vraia.com/"
            details: |1-
                I take **defect detection and segmentation** models (CNNs, ViT, YOLO, RF-DETR) and a **multimodal OCR** (GLM-OCR) to production for industrial tire inspection: mAP@50:95 of 0.83 and 98.56% exact match reading sidewalls.

                I write about this work in [OCR in extreme conditions](/blog/ocr-industrial-glm-ocr/) and [CNNs vs Vision Transformers](/blog/cnn-vs-vision-transformers-inspeccion-industrial/).
            tags: ["PyTorch", "Vision Transformers", "YOLO", "RF-DETR", "GLM-OCR", "LoRA", "vLLM", "Docker"]
          - position: Data Scientist & AI Researcher
            dates: June 2024 - June 2025
            company: AIR Institute & BISITE Research Group
            url: "https://www.air-institute.org/"
            details: |1-
                Research in **NLP and LLMs**: an ontology-based misinformation-detection architecture built with LLM-generated ontologies (published at DCAI'25), **RAG** pipelines and **multi-agent** systems, plus computer vision projects.

                Publication: [DCAI'25 paper](/DCAI.pdf).
            tags: ["NLP", "LLMs", "RAG", "ChromaDB", "Multi-agent", "Ollama", "Computer Vision", "Python"]
          - position: Researcher · Internship
            dates: January 2024 - July 2024
            company: Universidad Miguel Hernández — SCOLAb Group
            url: "https://seneca.umh.es/"
            details: |1-
                I developed **Lagrangian methods** to automatically identify **atmospheric blocking** situations — the basis of my thesis and a publication in progress.

                I tell the full story in [Atmospheric blocking, a Lagrangian view](/blog/tfg/).
            tags: ["Python", "Atmospheric Physics", "HYSPLIT", "ERA5", "DBSCAN"]
      education:
        title: Education
        icon: fas fa-graduation-cap
        panelId: education-panel
        list:
          - degree: Bachelor's Degree in Physics
            college: Universidad de Alicante
            dates: 2020 - 2024
            details: "+120 ECTS from the Mathematics degree taken in parallel (UA simultaneous-studies program)."
            thesis_title: "A Lagrangian method for the identification of atmospheric blocking situations"
            thesis_url: "/tfg.pdf"
          - degree: SICUE Exchange — Physics & Mathematics
            college: Universidad de Salamanca
            dates: 2022 - 2023
            details: "International mobility scholarship."
      publication:
        title: Publications
        icon: fas fa-book
        format:
          - title
        types:
          - In development
          - DCAI'25
        list:
          - title: AI-Powered Ontology-Based Architecture for Misinformation Detection in Fiction Works
            type: DCAI'25
            pdf_url: "/DCAI.pdf"
          - title: A Lagrangian Method for the Identification of Atmospheric Blocking Situations
            type: In development
      project:
        title: Projects
        icon: fas fa-project-diagram
        list:
          - title: "Tire Defect Detection"
            description: "Computer vision pipeline for automatic defect detection in the tire industry using deep learning."
            icon: "fas fa-eye"
            color: "cyan"
            tech: [PyTorch, OpenCV, Docker, AWS]
            url: ""
            status: "En producción"
          - title: "AI Misinformation Detection"
            description: "Ontology-based AI architecture for detecting misinformation in fiction works. Published at DCAI'25."
            icon: "fas fa-shield-alt"
            color: "violet"
            tech: [NLP, Transformers, Python, Ontologies]
            url: "/DCAI.pdf"
            status: "Publicado"
          - title: "Lagrangian Atmospheric Blocking"
            description: "Lagrangian method for automatic identification of atmospheric blocking situations using HYSPLIT trajectories."
            icon: "fas fa-cloud-sun"
            color: "amber"
            tech: [Python, HYSPLIT, ERA5, MATLAB]
            url: "/tfg.pdf"
            status: "TFG completado"
          - title: "Talk to Me"
            description: "CLI for practicing conversational English with an AI tutor. Speak through your microphone, Whisper transcribes your voice in real time, and a local LLM (Ollama) keeps the conversation going."
            icon: "fas fa-microphone"
            color: "rose"
            tech: [Python, Whisper, Ollama, CLI]
            url: "https://github.com/juanmanuelruizm/talk-to-me"
            status: "Activo"
          - title: "Local Agent with Ollama"
            description: "Conversational console agent running 100% locally on Ollama. Native tool calling: file read/write, web search with DuckDuckGo, Python code execution, and RAG with ChromaDB to query your own documents."
            icon: "fas fa-robot"
            color: "cyan"
            tech: [Python, Ollama, ChromaDB, RAG]
            url: "https://github.com/juanmanuelruizm/chatbot"
            status: "Activo"
          - title: "Frontend: An Introductory Course"
            description: "Educational frontend web development repository. Covers HTML, CSS and modern layouts (Flexbox/Grid) with detailed theory and commented examples. Under progressive development."
            icon: "fas fa-laptop-code"
            color: "indigo"
            tech: [HTML, CSS, Flexbox, Grid]
            url: "https://github.com/juanmanuelruizm/frontend-an-introductory-course"
            status: "En desarrollo"
          - title: "Personal Portfolio"
            description: "This website: a static portfolio built with Hugo and Tailwind CSS, deployed on GitHub Pages with CI/CD."
            icon: "fas fa-code"
            color: "emerald"
            tech: [Hugo, Tailwind CSS, JavaScript, GitHub Pages]
            url: "https://github.com/JuanManuelRM7/juanma_web"
            status: "Activo"
build:
  writeStats: true
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\[', '\]']
          inline:
            - ['$', '$']
            - ['\(', '\)']
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
    lineNumbersInTable: false
    noClasses: false
