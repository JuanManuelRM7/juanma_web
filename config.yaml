            tech: [PyTorch, RF-DETR, GLM-OCR, LoRA, vLLM, Docker]
            icon: "fas fa-eye"
            color: "emerald"
            status: production
            links:
              posts:
                - title: "OCR in extreme conditions (ES)"
                  url: "/blog/ocr-industrial-glm-ocr/"
                - title: "CNNs vs Vision Transformers (ES)"
                  url: "/blog/cnn-vs-vision-transformers-inspeccion-industrial/"
          - id: glm-ocr-lora
            title: "GLM-OCR + LoRA for key information extraction on receipts and invoices"
            description: "LoRA adaptation of the multimodal GLM-OCR model (LLaMA-Factory) that returns structured JSON from the image of a receipt or an invoice. Fully local inference."
            tech: [GLM-OCR, LoRA, LLaMA-Factory, Python]
            icon: "fas fa-font"
            color: "amber"
            status: development
            links:
              repo: "https://github.com/juanmanuelruizm/ocr-tickets"
              more:
                - title: "invoice-ocr"
                  url: "https://github.com/juanmanuelruizm/invoice-ocr"
          - id: vision-pytorch
            title: "vision-pytorch: DINOv2/v3 pipelines for classification and features"
            description: "Training, evaluation and embedding extraction with Meta's ViT backbones: full fine-tuning, linear probe or raw feature extractor, with per-class metrics and checkpoints."
            tech: [PyTorch, DINOv2, DINOv3, ViT]
            icon: "fas fa-code"
            color: "indigo"
            status: development
            links:
              repo: "https://github.com/juanmanuelruizm/vision-pytorch"
          - id: tfg-bloqueos
            cover: "images/proyectos/tfg/dbscan.png"
            title: "Lagrangian identification of atmospheric blocking (bachelor's thesis)"
            description: "Thousands of HYSPLIT back-trajectories on ERA5 and DBSCAN clustering to locate blockings from the actual stagnation of air, without Eulerian thresholds. Validated on the 2003 and 2019 heatwaves."
            tech: [Python, HYSPLIT, ERA5, DBSCAN]
            icon: "fas fa-cloud-sun"
            color: "amber"
            status: completed
            links:
              repo: "https://github.com/juanmanuelruizm/TFG"
              paper: "/tfg.pdf"
              posts:
                - title: "Post (ES)"
                  url: "/blog/tfg/"
          - id: agente-ollama
            title: "Local agent with Ollama: tool calling and RAG"
            description: "A fully local console agent with native tools (files, web search, Python execution) and RAG over your own documents with ChromaDB."
            tech: [Python, Ollama, ChromaDB, RAG]
            icon: "fas fa-robot"
            color: "rose"
            status: active
            links:
              repo: "https://github.com/juanmanuelruizm/chatbot"
