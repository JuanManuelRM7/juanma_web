      aboutme:
        title: About me
        icon: fas fa-user
        description: "Physicist and mathematician specialized in Machine Learning and Computer Vision engineering. I take vision and language models to real production: from data to deployment with Docker, vLLM and MLflow. I care about understanding models deeply, not just training them. When I am not training models, I write about physics, chaos and meteorology on this blog."
      experience:
        title: Experience
        icon: fas fa-briefcase
        panelId: experience-panel
        list:
          - position: ML Engineer · Computer Vision & LLMs
            dates: June 2025 - *Present*
            start: "2025-06"
            end: ""
            company: VRAIA Corp.
            url: "https://vraia.com/"
            details: |1-
                I take **defect detection and segmentation** models (CNNs, ViT, YOLO, RF-DETR) and a **multimodal OCR** (GLM-OCR) to production for industrial tire inspection: mAP@50:95 of 0.83 and 98.56% exact match reading sidewalls.

                I write about this work in [OCR in extreme conditions](/blog/ocr-industrial-glm-ocr/) and [CNNs vs Vision Transformers](/blog/cnn-vs-vision-transformers-inspeccion-industrial/).
            tags: ["PyTorch", "Vision Transformers", "YOLO", "RF-DETR", "GLM-OCR", "LoRA", "LLaMA-Factory", "vLLM", "MLflow", "Docker", "C++"]
            highlights:
              - "Design and training of **defect detection and segmentation** models (CNNs, Vision Transformers, YOLO, RF-DETR) for industrial tire inspection: **mAP@50:95 of 0.83** on multi-class segmentation over in-house datasets of thousands of images."
              - "Fine-tuning of a multimodal language model (**GLM-OCR**) with **LoRA** via LLaMA-Factory to read text on tire sidewalls: **98.56% exact match** in production; served with vLLM and Ollama."
              - "**Synthetic defect generation** pipeline with generative models to enlarge scarce datasets and improve detection robustness."
              - "**Technical appraisal** with CNNs and Vision Transformers to compare products objectively and reproducibly from their structural and appearance parts."
              - "**ETL** pipelines for extracting, transforming and augmenting visual datasets at industrial scale."
              - "Deployment and monitoring with **Docker, MLflow and TensorBoard**; evaluation metrics (precision, recall, F1, mAP, IoU) for real-time validation; technical documentation and **algorithm specification in C++** for the client team."
          - position: Data Scientist & AI Researcher
            dates: June 2024 - June 2025
            start: "2024-06"
            end: "2025-06"
            company: AIR Institute & BISITE Research Group
            url: "https://www.air-institute.org/"
            details: |1-
                Research in **NLP and LLMs**: an ontology-based misinformation-detection architecture built with LLM-generated ontologies (published at DCAI'25), **RAG** pipelines and **multi-agent** systems, plus computer vision projects.

                Publication: [DCAI'25 paper](/DCAI.pdf).
            tags: ["NLP", "LLMs", "RAG", "ChromaDB", "Multi-agent", "Ollama", "Computer Vision", "Python"]
            highlights:
              - "Research and development of **NLP and LLM** solutions, including a misinformation-detection architecture based on ontologies generated with language models (**published at DCAI'25**)."
              - "**RAG** and semantic-retrieval pipelines with vector databases (ChromaDB) and **multi-agent** systems (Ollama, DeepSeek, GPT-4o-mini), focused on cutting cost and latency."
              - "Computer vision projects (detection, classification and segmentation) and end-to-end ML project management: requirements, development, validation and documentation."
              - "Direct interaction with clients to capture requirements and adapt state-of-the-art solutions to real use cases."
          - position: Researcher · Internship
            dates: January 2024 - July 2024
            start: "2024-01"
            end: "2024-07"
            company: Universidad Miguel Hernández — SCOLAb Group
            url: "https://seneca.umh.es/"
            details: |1-
                I developed **Lagrangian methods** to automatically identify **atmospheric blocking** situations — the basis of my thesis and a publication in progress.

                I tell the full story in [Atmospheric blocking, a Lagrangian view](/blog/tfg/).
            tags: ["Python", "Atmospheric Physics", "HYSPLIT", "ERA5", "DBSCAN"]
            highlights:
              - "Development of **Lagrangian methods** for the automatic identification of **atmospheric blocking** situations, the basis of my thesis and of a publication in progress."
              - "Collaboration on projects of the atmospheric physics group."
      education:
