            description: "Defect detection and segmentation (CNNs, ViT, YOLO, RF-DETR) plus sidewall reading with a LoRA-tuned GLM-OCR, in production at VRAIA. Served with vLLM and Docker."
            metrics:
              - "mAP@50:95 of 0.83 on multi-class segmentation"
